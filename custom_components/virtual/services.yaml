set_state:
  name: Set state
  description: Set the state of a virtual entity. Button entities are not supported.
  fields:
    entity_id:
      name: Entity ID
      description: Virtual entity ID to update.
      required: true
      selector:
        entity:
          integration: virtual
    value:
      name: Value
      description: New state value. The value is coerced according to the entity type.
      required: true
      selector:
        text:
import_yaml:
  name: Import YAML
  description: Import virtual devices from virtual.yaml in the Home Assistant config directory and reload changed entries.
  fields: {}
export_yaml:
  name: Export YAML
  description: Export virtual devices to virtual.yaml in the Home Assistant config directory.
  fields: {}
