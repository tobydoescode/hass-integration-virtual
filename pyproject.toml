[project]
name = "ha-virtual-integration"
version = "0.1.0"
description = "Home Assistant custom integration for virtual devices and entities"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-homeassistant-custom-component>=0.13",
    "pre-commit>=4.0",
    "ruff>=0.11",
]

[tool.ruff]
# target-version is inferred from project.requires-python -- do not set it here,
# or the two drift and only one of them gets bumped.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901", "PIE"]

[tool.pyright]
pythonVersion = "3.13"
reportIncompatibleVariableOverride = false
reportArgumentType = false
reportAttributeAccessIssue = false

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
